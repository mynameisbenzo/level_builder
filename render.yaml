services:
  - type: web
    name: level-builder-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt && flask --app "app.main:create_app('production')" db upgrade
    startCommand: gunicorn wsgi:app
    autoDeployTrigger: checksPass
    previews:
      generation: automatic
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://pixelmaker.win
      - key: RACE_TICKET_SECRET
        sync: false

  - type: web
    name: level-builder-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    autoDeployTrigger: checksPass
    previews:
      generation: automatic
    domains:
      - pixelmaker.win
      - www.pixelmaker.win
    envVars:
      - key: VITE_API_BASE_URL
        value: https://level-builder-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html