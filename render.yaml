services:
  - type: web
    name: level-builder-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://level-builder-frontend.onrender.com

  - type: web
    name: level-builder-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    envVars:
      - key: VITE_API_BASE_URL
        value: https://level-builder-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html